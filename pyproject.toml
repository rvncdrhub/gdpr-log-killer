[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuh-rule-tracker"
version = "0.1.0"
description = "Track and audit changes to Wazuh rule files over time"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wazuh_rule_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
